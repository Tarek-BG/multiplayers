<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Flip Book · JSON Driven</title>

    <!-- ===== 1 bloc Book (overlay, sticky, etc.) ===== -->
    <style>
        /* 1 bloc Book :start */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .sticky {
            position: fixed;
            top: 0;
            width: 100%;
        }

        .container {
            position: relative;
            width: 50%;
            max-width: 300px;
        }

        .image {
            display: block;
            width: 100%;
            height: auto;
        }

        .overlay {
            position: absolute;
            bottom: 320px;
            background: rgb(0, 0, 0);
            background: rgba(0, 0, 0, 0.5);
            color: #f1f1f1;
            width: 100%;
            transition: .5s ease;
            opacity: 0;
            color: white;
            font-size: 20px;
            padding: 20px;
            text-align: center;
        }

        .container:hover .overlay {
            opacity: .5;
        }
        /* 1 bloc Book :end */
    </style>

    <!-- ===== 2 bloc Book : base styles (no hardcoded image URLs) ===== -->
    <style>
        /* 2 bloc Book :start */
        @import url("https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap");

        * {
            padding: 0;
            margin: 0 auto;
            box-sizing: border-box;
        }

        body {
            font-family: "Indie Flower", cursive;
            background-image: radial-gradient(white, blue, white);
            color: #555;
            text-align: center;
            padding: 4em 0;
        }

        .img-eye {
            width: 300px;
        }

        /* pre‑load sprite – now injected by JS */
        .imgLoader {
            position: fixed;
            width: 1px;
            height: 1px;
            animation: preLoad 1s steps(1);
        }

        /* container & book */
        .container {
            position: relative;
            width: 420px;
            border: #fff solid 2px;
            border-radius: 4px;
            height: 420px;
        }

        .title {
            position: absolute;
            top: 45px;
            left: 0;
            width: 100%;
            font-size: 2em;
            font-weight: normal;
            line-height: 1;
        }

        .credit {
            position: absolute;
            top: 100%;
            left: 0;
            font-size: 0.9em;
            text-align: left;
        }

        .book {
            position: relative;
            perspective: 630px;
            perspective-origin: center 50px;
            transform: scale(1.2);
            filter: drop-shadow(0px 10px 5px rgba(0, 0, 0, 0.25));
        }

        /* page base */
        .page {
            width: 210px;
            height: 300px;
            background-color: #bbb;
            position: absolute;
            top: 0px;
            right: 50%;
            transform-origin: 100% 100%;
            border: solid #555 2px;
            background-size: 420px 300px;
            background-position: center;
            transform-style: preserve-3d;
        }
        .page:nth-child(1) {
            transform: rotateX(60deg) rotateY(3deg);
        }
        .page:nth-child(2) {
            transform: rotateX(60deg) rotateY(4.5deg);
        }
        .page:nth-child(3) {
            transform: rotateX(60deg) rotateY(6deg);
            animation: nextPage 25s infinite -24s steps(1);
            background-size: 420px 300px;
            background-position: -2px -2px;
        }
        .page:nth-child(4) {
            transform: rotateX(60deg) rotateY(177deg);
        }
        .page:nth-child(5) {
            transform: rotateX(60deg) rotateY(175.5deg);
        }
        .page:nth-child(6) {
            transform: rotateX(60deg) rotateY(174deg);
            overflow: hidden;
        }
        .page:nth-child(6)::after {
            content: "";
            width: 210px;
            height: 300px;
            position: absolute;
            top: 0px;
            right: 0%;
            transform-origin: center;
            transform: rotateY(180deg);
            animation: nextPage 25s -20s infinite steps(1);
            background-size: 420px 300px;
            background-position: 100% -2px;
        }

        /* gap */
        .gap {
            width: 10px;
            height: 300px;
            background: none;
            transform: rotateX(60deg);
            transform-origin: bottom;
            position: absolute;
            top: 0px;
            left: calc(50% - 5px);
        }
        .gap::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translate(-50%, 50%);
            background-color: #555;
            width: 10px;
            height: 5px;
            border-radius: 50%;
        }

        .pages,
        .flips {
            transform-style: preserve-3d;
        }

        /* flip base */
        .flip {
            width: 32px;
            height: 300px;
            position: absolute;
            top: 0px;
            transform-origin: 100% 100%;
            right: 100%;
            border: solid #555;
            border-width: 2px 0px;
            perspective: 4200px;
            perspective-origin: center;
            transform-style: preserve-3d;
            background-size: 420px 300px;
        }
        .flip::after {
            content: "";
            position: absolute;
            top: 0px;
            right: 0%;
            width: 100%;
            height: 100%;
            transform-origin: center;
            background-size: 420px 300px;
        }

        .flip.flip1 {
            right: 50%;
            animation: flip1 5s infinite ease-in-out;
            border-width: 2px 2px 2px 0;
        }
        .flip.flip1::after {
            animation: nextFlip1 25s -20s infinite steps(1);
        }

        .flip:not(.flip1) {
            right: calc(100% - 2px);
            top: -2px;
            transform-origin: right;
            animation: flip2 5s ease-in-out infinite;
        }
        .flip.flip2::after {
            animation: nextFlip2 25s -20s infinite steps(1);
        }
        .flip.flip3::after {
            animation: nextFlip3 25s -20s infinite steps(1);
        }
        .flip.flip4::after {
            animation: nextFlip4 25s -20s infinite steps(1);
        }
        .flip.flip5::after {
            animation: nextFlip5 25s -20s infinite steps(1);
        }
        .flip.flip6::after {
            animation: nextFlip6 25s -20s infinite steps(1);
        }
        .flip.flip7::after {
            animation: nextFlip7 25s -20s infinite steps(1);
        }
        .flip.flip7 {
            width: 30px;
            border-width: 2px 0px 2px 2px;
        }
        .flip.flip7::after {
            animation: nextFlip7 25s -20s infinite steps(1);
        }

        /* flip keyframes (geometry only – photos injected by JS) */
        @keyframes flip1 {
            0%,
            20% {
                transform: rotateX(60deg) rotateY(6deg);
            }
            80%,
            100% {
                transform: rotateX(60deg) rotateY(174deg);
            }
        }
        @keyframes flip2 {
            0%,
            20% {
                transform: rotateY(0deg) translateY(0px);
            }
            50% {
                transform: rotateY(-15deg) translateY(0px);
            }
        }

        .twitterLink {
            position: fixed;
            bottom: 0.5em;
            right: 0.5em;
        }
        .twitterLink img {
            width: 2em;
            filter: grayscale(100%);
            transition: filter 0.25s;
        }
        .twitterLink img:hover {
            filter: grayscale(0%);
        }
        /* 2 bloc Book :end */
    </style>

    <!-- ===== DYNAMIC CSS INJECTOR ===== -->
    <style id="dynamic-book-styles">
        /* will be filled by JavaScript from ../img/photos.json */
    </style>
    <script src="code-highlights.js"></script>
</head>
  <script src="code-highlights.js"></script>
<body>

    <!-- ===== PRE‑LOAD SPRITE (injected) ===== -->
    <div class="imgLoader"></div>

    <!-- ===== FLIP BOOK MARKUP ===== -->
    <div class="container">
        <h1 class="title">✧ 3D Flip Book ✧</h1>
        <div class="book">
            <div class="pages">
                <div class="page"></div>
                <div class="page"></div>
                <div class="page"></div>
                <div class="page"></div>
                <div class="page"></div>
                <div class="page"></div>
            </div>
            <div class="flips">
                <div class="flip flip1"></div>
                <div class="flip flip2"></div>
                <div class="flip flip3"></div>
                <div class="flip flip4"></div>
                <div class="flip flip5"></div>
                <div class="flip flip6"></div>
                <div class="flip flip7"></div>
            </div>
            <div class="gap"></div>
        </div>
        <p class="credit">photos loaded from <code>../img/photos.json</code></p>
    </div>

    <!-- ===== LOAD photos FROM JSON & GENERATE CSS ===== -->
    <script>
    (function() {
        const JSON_URL = 'img/photos.json';

        fetch(JSON_URL)
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                const imgs = data.photos || data;
                if (!Array.isArray(imgs) || imgs.length < 5) {
                    throw new Error('JSON must contain an array of at least 5 image paths');
                }
                generateStyles(imgs);
            })
            .catch(err => {
                console.warn('Failed to load photos.json, using fallback photos.', err);
                const fallback = [
                    'img/photo1.jpg',
                    'img/photo2.jpg',
                    'img/photo3.jpg',
                    'img/photo4.jpg',
                    'img/photo5.jpg'
                ];
                generateStyles(fallback);
            });

        function generateStyles(imgArray) {
            // ... (same as before, just uses the corrected paths)
        }
    })();
</script>
