<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Gallery · Drive JSON</title>
    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api">
    </script>
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e14;
            color: #eee;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ----- APP SHELL ----- */
        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 820px;
            height: 100vh;
            max-height: 100vh;
            background: #131a24;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        /* ----- TOP RIGHT: device id + email ----- */
        .top-right {
            position: absolute;
            top: 12px;
            right: 16px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            background: rgba(11, 14, 20, 0.75);
            backdrop-filter: blur(6px);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid #2a3a4a;
            font-size: 0.7rem;
            line-height: 1.4;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .top-right.hidden {
            opacity: 0;
            transform: translateY(-60px);
            pointer-events: none;
        }
        .top-right .device-label {
            color: #7a9bb8;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .top-right .device-id {
            color: #b8d8f0;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .top-right .email-label {
            color: #7a9bb8;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }
        .top-right .user-email {
            color: #b8d8f0;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .top-right .divider {
            width: 100%;
            height: 1px;
            background: #1f3140;
            margin: 4px 0;
        }

        /* ----- HEADER (user) ----- */
        #header {
            flex-shrink: 0;
            background: linear-gradient(135deg, #1a2533, #0f1722);
            padding: 18px 20px 14px;
            border-bottom: 1px solid #2a3a4a;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.45s ease,
                margin 0.45s ease;
            z-index: 20;
            position: relative;
            padding-right: 160px;
            /* make room for top-right */;
        }
        #header.hidden {
            transform: translateY(-120%);
            opacity: 0;
            pointer-events: none;
            padding: 0;
            height: 0;
            border: none;
            overflow: hidden;
            margin: 0;
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .user-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #4a7a9c;
            flex-shrink: 0;
            background: #1e2d3d;
        }
        .user-info {
            flex: 1;
            min-width: 120px;
        }
        .user-id-badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a9bb8;
            background: #1a2a3a;
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .user-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            display: block;
        }
        .user-presentation {
            font-size: 0.82rem;
            color: #b0c8dd;
            margin-top: 2px;
            line-height: 1.3;
            opacity: 0.9;
        }

        /* ----- VIDEOS (middle) ----- */
        #videos {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 12px;
            scroll-behavior: smooth;
            background: #0b1119;
            transition: padding 0.3s ease;
        }
        #videos::-webkit-scrollbar {
            width: 5px;
        }
        #videos::-webkit-scrollbar-track {
            background: #0b1119;
        }
        #videos::-webkit-scrollbar-thumb {
            background: #3a5a7a;
            border-radius: 10px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            max-width: 100%;
        }

        .video-item
