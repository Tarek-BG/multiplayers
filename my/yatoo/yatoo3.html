<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yatoo · Video Gallery</title>
    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api">
    </script>
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e14;
            color: #eee;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ----- APP SHELL ----- */
        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 820px;
            height: 100vh;
            max-height: 100vh;
            background: #131a24;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        /* ----- TOP RIGHT: device id + email ----- */
        .top-right {
            position: absolute;
            top: 12px;
            right: 16px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            background: rgba(11, 14, 20, 0.75);
            backdrop-filter: blur(6px);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid #2a3a4a;
            font-size: 0.7rem;
            line-height: 1.4;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .top-right.hidden {
            opacity: 0;
            transform: translateY(-60px);
            pointer-events: none;
        }
        .top-right .device-label {
            color: #7a9bb8;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .top-right .device-id {
            color: #b8d8f0;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .top-right .email-label {
            color: #7a9bb8;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }
        .top-right .user-email {
            color: #b8d8f0;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .top-right .divider {
            width: 100%;
            height: 1px;
            background: #1f3140;
            margin: 4px 0;
        }

        /* ----- HEADER (user) ----- */
        #header {
            flex-shrink: 0;
            background: linear-gradient(135deg, #1a2533, #0f1722);
            padding: 18px 20px 14px;
            border-bottom: 1px solid #2a3a4a;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.45s ease,
                margin 0.45s ease;
            z-index: 20;
            position: relative;
            padding-right: 160px;
        }
        #header.hidden {
            transform: translateY(-120%);
            opacity: 0;
            pointer-events: none;
            padding: 0;
            height: 0;
            border: none;
            overflow: hidden;
            margin: 0;
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .user-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #4a7a9c;
            flex-shrink: 0;
            background: #1e2d3d;
        }
        .user-info {
            flex: 1;
            min-width: 120px;
        }
        .user-id-badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a9bb8;
            background: #1a2a3a;
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .user-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            display: block;
        }
        .user-presentation {
            font-size: 0.82rem;
            color: #b0c8dd;
            margin-top: 2px;
            line-height: 1.3;
            opacity: 0.9;
        }

        /* ----- VIDEOS (middle) ----- */
        #videos {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 12px;
            scroll-behavior: smooth;
            background: #0b1119;
        }
        #videos::-webkit-scrollbar {
            width: 5px;
        }
        #videos::-webkit-scrollbar-track {
            background: #0b1119;
        }
        #videos::-webkit-scrollbar-thumb {
            background: #3a5a7a;
            border-radius: 10px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            max-width: 100%;
        }

        .video-item {
            background: #16212b;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #243544;
            cursor: pointer;
        }
        .video-item:hover {
            transform: scale(1.005);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.7);
            border-color: #3a6a8a;
        }
        .video-item .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 177.78%;
            background: #000;
        }
        .video-item .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-item .video-title {
            padding: 10px 14px 6px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #d6e4f0;
            line-height: 1.3;
            background: #0f1a24;
            border-top: 1px solid #1f3140;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ----- COMMENTS (footer) max 1/4 ----- */
        #comments {
            flex-shrink: 0;
            background: #0f1a24;
            border-top: 1px solid #1f3140;
            max-height: 25vh;
            display: flex;
            flex-direction: column;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.45s ease,
                max-height 0.45s ease;
            z-index: 20;
            position: relative;
            overflow: hidden;
        }
        #comments.hidden {
            transform: translateY(120%);
            opacity: 0;
            pointer-events: none;
            max-height: 0;
            border: none;
            overflow: hidden;
        }

        .comments-bar {
            flex-shrink: 0;
            background: #16232e;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid #1f3140;
            transition: background 0.2s ease;
        }
        .comments-bar:hover {
            background: #1c2d3c;
        }
        .comments-bar .bar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #6a8aa8;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .comments-bar .bar-title .badge-count {
            background: #1a2a3a;
            padding: 0 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            color: #8ab0d0;
            font-weight: 600;
        }
        .comments-bar .bar-toggle {
            color: #6a8aa8;
            font-size: 0.7rem;
            background: #1a2a3a;
            padding: 2px 12px;
            border-radius: 20px;
            transition: all 0.2s ease;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid #2a3a4a;
        }
        .comments-bar .bar-toggle:hover {
            background: #2a3a4a;
            color: #b0d0e8;
        }
        .comments-bar .bar-toggle .arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .comments-bar .bar-toggle .arrow.open {
            transform: rotate(180deg);
        }

        .comments-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px 12px;
            transition: max-height 0.4s ease, opacity 0.3s ease;
            max-height: 1000px;
            opacity: 1;
        }
        .comments-content.collapsed {
            max-height: 0 !important;
            padding: 0 16px;
            opacity: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .comments-content::-webkit-scrollbar {
            width: 4px;
        }
        .comments-content::-webkit-scrollbar-thumb {
            background: #3a5a7a;
            border-radius: 10px;
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .comment-item {
            display: flex;
            gap: 10px;
            align-items: baseline;
            font-size: 0.78rem;
            padding: 5px 0;
            border-bottom: 1px solid #1a2a3a;
            cursor: pointer;
            transition: background 0.15s ease, padding-left 0.15s ease;
            border-radius: 6px;
            padding-left: 6px;
            padding-right: 6px;
        }
        .comment-item:hover {
            background: #1a2a3a;
            padding-left: 12px;
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .comment-item .comment-video-title {
            color: #8ab0d0;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
            flex-shrink: 0;
        }
        .comment-item .comment-text {
            color: #c8dce8;
            flex: 1;
            word-break: break-word;
        }
        .comment-item .comment-badge {
            color: #4a7a9c;
            font-size: 0.6rem;
            background: #1a2a3a;
            padding: 0 8px;
            border-radius: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .comment-item .play-icon {
            color: #4a8aaa;
            font-size: 0.7rem;
            opacity: 0.6;
            flex-shrink: 0;
            transition: opacity 0.2s ease;
        }
        .comment-item:hover .play-icon {
            opacity: 1;
        }

        /* ----- FALLBACK INPUT (when fetch fails) ----- */
        .fallback-area {
            padding: 20px;
            background: #1a2533;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
        }
        .fallback-area label {
            font-size: 0.9rem;
            color: #b0c8dd;
            display: block;
            margin-bottom: 8px;
        }
        .fallback-area textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #2a3a4a;
            background: #0f1722;
            color: #eee;
            font-size: 0.8rem;
            font-family: 'Segoe UI', monospace;
            margin-bottom: 10px;
            resize: vertical;
            min-height: 120px;
        }
        .fallback-area input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #2a3a4a;
            background: #0f1722;
            color: #eee;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .fallback-area button {
            background: #4a7a9c;
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin: 4px;
        }
        .fallback-area button:hover {
            background: #5a8aaa;
        }
        .fallback-area .hint {
            font-size: 0.7rem;
            color: #6a8aa8;
            margin-top: 6px;
        }
        .fallback-area .error-msg {
            color: #d47a7a;
            font-size: 0.85rem;
            margin: 6px 0;
        }

        /* ----- LOADING / ERROR ----- */
        .loading-state {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #6a8aa8;
            font-size: 1rem;
            flex-direction: column;
            gap: 12px;
            padding: 30px 20px;
        }
        .loading-state .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1a2a3a;
            border-top-color: #4a8aaa;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .error-state {
            color: #d47a7a;
            text-align: center;
            padding: 30px 20px;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .error-state .hint {
            color: #7a9bb8;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        /* ----- RESPONSIVE ----- */
        @media (min-width: 540px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            #header {
                padding: 20px 28px 16px;
                padding-right: 180px;
            }
            .user-avatar {
                width: 68px;
                height: 68px;
            }
            .user-name {
                font-size: 1.25rem;
            }
            .comment-item .comment-video-title {
                max-width: 200px;
            }
            .top-right {
                font-size: 0.75rem;
                padding: 10px 18px;
                top: 14px;
                right: 20px;
            }
        }

        @media (min-width: 820px) {
            .app {
                max-width: 960px;
                border-radius: 20px;
                height: 94vh;
                box-shadow: 0 10px 60px rgba(0, 0, 0, 0.9);
            }
            .video-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 22px;
            }
            .user-avatar {
                width: 76px;
                height: 76px;
            }
            .comment-item .comment-video-title {
                max-width: 280px;
            }
            #header {
                padding-right: 210px;
            }
        }

        @media (max-width: 400px) {
            .user-card {
                gap: 10px;
            }
            .user-avatar {
                width: 44px;
                height: 44px;
            }
            .user-name {
                font-size: 0.95rem;
            }
            .user-presentation {
                font-size: 0.7rem;
            }
            .video-item .video-title {
                font-size: 0.7rem;
                padding: 6px 10px 4px;
            }
            #videos {
                padding: 8px 10px 8px;
            }
            .comment-item {
                font-size: 0.7rem;
                flex-wrap: wrap;
                gap: 4px;
            }
            .comment-item .comment-video-title {
                max-width: 80px;
            }
            .top-right {
                font-size: 0.6rem;
                padding: 5px 10px;
                top: 8px;
                right: 10px;
            }
            #header {
                padding-right: 120px;
                padding: 12px 14px 10px;
            }
            .comments-bar .bar-title {
                font-size: 0.65rem;
            }
            .comments-bar {
                padding: 5px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- TOP RIGHT -->
        <div class="top-right" id="topRight">
            <span class="device-label">📱 DEVICE</span>
            <span class="device-id" id="deviceId">—</span>
            <div class="divider"></div>
            <span class="email-label">✉️ EMAIL</span>
            <span class="user-email" id="userEmail">—</span>
        </div>

        <!-- HEADER -->
        <header id="header">
            <div class="user-card" id="userCard">
                <img class="user-avatar" id="userAvatar" src="" alt="Avatar" />
                <div class="user-info">
                    <span class="user-id-badge" id="userIdBadge">—</span>
                    <span class="user-name" id="userName">—</span>
                    <p class="user-presentation" id="userPresentation">—</p>
                </div>
            </div>
        </header>

        <!-- VIDEOS -->
        <main id="videos">
            <div id="videoGrid" class="video-grid">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <span>Loading videos via proxy…</span>
                </div>
            </div>
        </main>

        <!-- COMMENTS -->
        <footer id="comments">
            <div class="comments-bar" id="commentsBar">
                <span class="bar-title">
                    💬 Video Comments
                    <span class="badge-count" id="commentCount">0</span>
                </span>
                <span class="bar-toggle" id="commentsToggle">
                    <span class="arrow" id="arrowIcon">▼</span> HIDE
                </span>
            </div>
            <div class="comments-content" id="commentsContent">
                <div id="commentList" class="comment-list">
                    <div class="loading-state" style="height:50px;font-size:0.8rem;">
                        <span>Loading comments…</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // ==============================================================
        // CONFIG – Google Drive file IDs (publicly shared)
        // ==============================================================
        const DRIVE_USER_FILE_ID = '1hOrrL-ydfLEae-lbqxA9cUhUdC6cucEA';
        const DRIVE_VIDEO_FILE_ID = '1yYWNab9wSGGY0gpBuwlcRdLm4HVkb1VO';
        const PHOTO_URL =
            'https://drive.google.com/uc?export=view&id=1eea2WSFEmVUvxU6besBr_dTWnFsFKFY8';

        const USER_JSON_URL = `https://drive.google.com/uc?export=download&id=${DRIVE_USER_FILE_ID}`;
        const VIDEO_JSON_URL = `https://drive.google.com/uc?export=download&id=${DRIVE_VIDEO_FILE_ID}`;

        // Proxy endpoint (simpler, returns raw text)
        const PROXY_URL = 'https://api.allorigins.win/raw?url=';

        // ==============================================================
        // STATE
        // ==============================================================
        let videoData = [];
        let userData = null;
        let players = {};
        let playerStates = {};
        let isAnyPlaying = false;
        let commentsCollapsed = false;

        const headerEl = document.getElementById('header');
        const commentsEl = document.getElementById('comments');
        const topRightEl = document.getElementById('topRight');
        const videoGrid = document.getElementById('videoGrid');
        const commentList = document.getElementById('commentList');
        const commentsBar = document.getElementById('commentsBar');
        const commentsContent = document.getElementById('commentsContent');
        const commentsToggle = document.getElementById('commentsToggle');
        const commentCountEl = document.getElementById('commentCount');

        // ==============================================================
        // DEVICE ID (generated locally)
        // ==============================================================
        function getDeviceId() {
            let id = localStorage.getItem('deviceUserId');
            if (!id) {
                id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
                localStorage.setItem('deviceUserId', id);
            }
            return id;
        }
        document.getElementById('deviceId').textContent = getDeviceId();

        // ==============================================================
        // FETCH VIA PROXY WITH TIMEOUT
        // ==============================================================
        function fetchWithTimeout(url, timeout = 10000) {
            return Promise.race([
                fetch(url),
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error(`Request timed out after ${timeout}ms`)), timeout)
                )
            ]);
        }

        async function fetchViaProxy(driveUrl) {
            const proxyUrl = PROXY_URL + encodeURIComponent(driveUrl);
            console.log(`🔄 Trying proxy: ${proxyUrl}`);
            const response = await fetchWithTimeout(proxyUrl, 10000);
            if (!response.ok) {
                throw new Error(`Proxy HTTP ${response.status}`);
            }
            const text = await response.text();

            // Check for HTML error page
            if (text.includes('<!DOCTYPE html>') || text.includes('<html')) {
                throw new Error('Proxy returned HTML – file may not be publicly shared.');
            }

            // Try to parse as JSON
            try {
                return JSON.parse(text);
            } catch (e) {
                // Maybe it's raw JSON without quotes? Try cleaning.
                const cleaned = text.trim();
                if (cleaned.startsWith('[') || cleaned.startsWith('{')) {
                    return JSON.parse(cleaned);
                }
                throw new Error('Response is not valid JSON: ' + text.substring(0, 100));
            }
        }

        // ==============================================================
        // LOAD DATA
        // ==============================================================
        async function loadData() {
            console.log('🔄 Loading users.json from Google Drive via proxy...');
            const users = await fetchViaProxy(USER_JSON_URL);
            if (!Array.isArray(users) || users.length === 0) {
                throw new Error('users.json must be an array with at least one user.');
            }
            userData = users[0];
            document.getElementById('userEmail').textContent = userData.email || '—';

            console.log('🔄 Loading myvideos.json from Google Drive via proxy...');
            const videos = await fetchViaProxy(VIDEO_JSON_URL);
            if (!Array.isArray(videos)) {
                throw new Error('myvideos.json must be an array of videos.');
            }
            videoData = videos;

            console.log('✅ Data loaded successfully!');
            return true;
        }

        // ==============================================================
        // RENDER USER
        // ==============================================================
        function renderUser() {
            if (!userData) return;
            document.getElementById('userIdBadge').textContent = '🆔 ' + (userData.id || 'user_001');
            document.getElementById('userName').textContent = userData.name || 'Anonymous';
            document.getElementById('userPresentation').textContent = userData.presentation || '';

            const avatar = document.getElementById('userAvatar');
            avatar.src = PHOTO_URL;
            avatar.alt = userData.name || 'User';
            avatar.onerror = function() {
                this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(userData.name || 'User') +
                    '&background=2a4a6a&color=fff&size=128';
            };
        }

        // ==============================================================
        // RENDER VIDEOS
        // ==============================================================
        function renderVideos() {
            if (!videoData.length) {
                videoGrid.innerHTML = `<div class="error-state">⚠️ No videos found in myvideos.json</div>`;
                return;
            }

            let html = '';
            videoData.forEach((v, index) => {
                let src = v.src || '';
                const title = v.title || `Video ${index + 1}`;
                const safeId = `player-${index}`;

                let embedSrc = src;
                if (src && src.includes('youtube.com/watch')) {
                    try {
                        const videoId = new URL(src).searchParams.get('v');
                        if (videoId) embedSrc = `https://www.youtube.com/embed/${videoId}`;
                    } catch (e) { /* ignore */ }
                } else if (src && src.includes('youtu.be/')) {
                    const videoId = src.split('youtu.be/')[1]?.split('?')[0];
                    if (videoId) embedSrc = `https://www.youtube.com/embed/${videoId}`;
                }

                html += `
                    <div class="video-item" data-index="${index}">
                        <div class="video-wrapper">
                            <iframe id="${safeId}"
                                    width="315" height="560"
                                    src="${embedSrc}"
                                    title="${title.replace(/"/g, '&quot;')}"
                                    frameborder="0"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    referrerpolicy="strict-origin-when-cross-origin"
                                    allowfullscreen>
                            </iframe>
                        </div>
                        <div class="video-title">${title}</div>
                    </div>
                `;
            });
            videoGrid.innerHTML = html;
        }

        // ==============================================================
        // RENDER COMMENTS
        // ==============================================================
        function renderComments() {
            if (!videoData.length) {
                commentList.innerHTML =
                    `<div class="error-state" style="padding:10px 0;font-size:0.8rem;">No comments available.</div>`;
                commentCountEl.textContent = '0';
                return;
            }

            let html = '';
            videoData.forEach((v, index) => {
                const title = v.title || `Video ${index + 1}`;
                const comment = v.comment || '—';
                html += `
                    <div class="comment-item" data-index="${index}">
                        <span class="play-icon">▶</span>
                        <span class="comment-video-title">${title}</span>
                        <span class="comment-text">${comment}</span>
                        <span class="comment-badge">#${index + 1}</span>
                    </div>
                `;
            });
            commentList.innerHTML = html;
            commentCountEl.textContent = videoData.length;

            document.querySelectorAll('.comment-item').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx)) playVideoByIndex(idx);
                });
            });
        }

        // ==============================================================
        // PLAY VIDEO BY INDEX
        // ==============================================================
        function playVideoByIndex(index) {
            const items = document.querySelectorAll('.video-item');
            if (index >= items.length) return;
            items[index].scrollIntoView({ behavior: 'smooth', block: 'center' });

            if (players[index] && typeof players[index].playVideo === 'function') {
                players[index].playVideo();
                isAnyPlaying = true;
                updateUIForPlayState(true);
                return;
            }

            initYouTubePlayers();
            setTimeout(() => {
                if (players[index] && typeof players[index].playVideo === 'function') {
                    players[index].playVideo();
                    isAnyPlaying = true;
                    updateUIForPlayState(true);
                }
            }, 500);
        }

        // ==============================================================
        // YOUTUBE PLAYER API
        // ==============================================================
        function initYouTubePlayers() {
            const iframes = document.querySelectorAll('.video-wrapper iframe');
            if (!iframes.length) return;
            iframes.forEach((iframe, index) => {
                const id = iframe.id;
                if (!id || players[index]) return;
                try {
                    players[index] = new YT.Player(id, {
                        events: {
                            'onStateChange': function(event) {
                                handleStateChange(index, event.data);
                            }
                        }
                    });
                } catch (e) { /* ignore */ }
            });
        }

        function handleStateChange(index, state) {
            playerStates[index] = state;
            const playing = Object.values(playerStates).some(s => s === 1);
            if (playing !== isAnyPlaying) {
                isAnyPlaying = playing;
                updateUIForPlayState(playing);
            }
        }

        function updateUIForPlayState(playing) {
            if (playing) {
                headerEl.classList.add('hidden');
                commentsEl.classList.add('hidden');
                topRightEl.classList.add('hidden');
            } else {
                headerEl.classList.remove('hidden');
                commentsEl.classList.remove('hidden');
                topRightEl.classList.remove('hidden');
            }
        }

        // ==============================================================
        // COMMENTS TOGGLE
        // ==============================================================
        function setupCommentsToggle() {
            commentsBar.addEventListener('click', function(e) {
                commentsCollapsed = !commentsCollapsed;
                if (commentsCollapsed) {
                    commentsContent.classList.add('collapsed');
                    commentsToggle.innerHTML = '<span class="arrow" id="arrowIcon">▶</span> SHOW';
                } else {
                    commentsContent.classList.remove('collapsed');
                    commentsToggle.innerHTML = '<span class="arrow" id="arrowIcon">▼</span> HIDE';
                }
            });
        }

        // ==============================================================
        // YOUTUBE API READY
        // ==============================================================
        let ytReady = false;
        window.onYouTubeIframeAPIReady = function() {
            ytReady = true;
            if (videoData.length) setTimeout(initYouTubePlayers, 300);
        };

        // ==============================================================
        // FALLBACK: click on video to toggle UI (if API fails)
        // ==============================================================
        let fallbackActive = false;

        function attachFallbackHandlers() {
            if (fallbackActive) return;
            fallbackActive = true;

            document.addEventListener('click', function(e) {
                const videoItem = e.target.closest('.video-item');
                if (!videoItem) return;
                if (Object.keys(players).length > 0) return;
                const currentlyPlaying = isAnyPlaying;
                if (!currentlyPlaying) {
                    isAnyPlaying = true;
                    updateUIForPlayState(true);
                } else {
                    isAnyPlaying = false;
                    updateUIForPlayState(false);
                }
            });

            document.addEventListener('click', function(e) {
                if (Object.keys(players).length > 0) return;
                if (!isAnyPlaying) return;
                const isVideo = e.target.closest('.video-item');
                const isHeader = e.target.closest('#header');
                const isComments = e.target.closest('#comments');
                const isTopRight = e.target.closest('.top-right');
                if (!isVideo && !isHeader && !isComments && !isTopRight) {
                    isAnyPlaying = false;
                    updateUIForPlayState(false);
                }
            });
        }

        // ==============================================================
        // SHOW FALLBACK INPUT (with pre-filled data)
        // ==============================================================
        function showFallbackInput(errorMsg) {
            // Pre-fill with known JSON content (so user can just click Load)
            const defaultUserJson = `[
  {
    "id": "user_001",
    "name": "Ben gadha Tarek",
    "photo": "https://raw.githubusercontent.com/Tarek-BG/multiplayers/main/family/data/foto/tarek_bg.png",
    "presentation": "History enthusiast and content creator",
    "email": "tarek@example.com",
    "linkjson": "https://drive.google.com/file/d/1yYWNab9wSGGY0gpBuwlcRdLm4HVkb1VO/view?usp=drive_link"
  }
]`;

            const defaultVideoJson = `[
  {
    "src": "https://www.youtube.com/embed/N5JgdiPmMcQ",
    "title": "La dynastie des Habsbourg commence avec le roi Philippe I (1506)",
    "comment": "Start of the Habsburg dynasty"
  },
  {
    "src": "https://www.youtube.com/embed/lL_-Vtm9A5c",
    "title": "Carthage: The City Rome Couldn’t Allow to Survive",
    "comment": "Ancient Carthage history"
  },
  {
    "src": "https://www.youtube.com/embed/YYW8gmXmQyE",
    "title": "Why Is The US So BIG?",
    "comment": "US territorial expansion"
  }
]`;

            const grid = document.getElementById('videoGrid');
            grid.innerHTML = `
                <div class="fallback-area">
                    <div class="error-msg">⚠️ ${errorMsg || 'Failed to load data via proxy.'}</div>
                    <label>📄 Paste your <strong>users.json</strong> content below</label>
                    <textarea id="userJsonInput">${defaultUserJson}</textarea>
                    <label>📄 Paste your <strong>myvideos.json</strong> content below</label>
                    <textarea id="videoJsonInput">${defaultVideoJson}</textarea>
                    <button id="loadManualBtn">Load Videos</button>
                    <div class="hint">The JSON is pre‑filled – just click the button above.<br>
                    Or paste your own content if needed.</div>
                </div>
            `;

            document.getElementById('loadManualBtn').addEventListener('click', function() {
                const userText = document.getElementById('userJsonInput').value.trim();
                const videoText = document.getElementById('videoJsonInput').value.trim();

                if (!userText || !videoText) {
                    alert('Please paste both users.json and myvideos.json content.');
                    return;
                }

                try {
                    const users = JSON.parse(userText);
                    if (!Array.isArray(users) || users.length === 0) {
                        throw new Error('users.json must be an array with at least one user.');
                    }
                    userData = users[0];
                    document.getElementById('userEmail').textContent = userData.email || '—';

                    const videos = JSON.parse(videoText);
                    if (!Array.isArray(videos)) {
                        throw new Error('myvideos.json must be an array.');
                    }
                    videoData = videos;

                    renderUser();
                    renderVideos();
                    renderComments();
                    setupCommentsToggle();

                    if (ytReady) setTimeout(initYouTubePlayers, 300);
                    else {
                        if (typeof YT !== 'undefined' && YT.Player) {
                            ytReady = true;
                            setTimeout(initYouTubePlayers, 300);
                        }
                    }
                    attachFallbackHandlers();

                } catch (err) {
                    alert('Error parsing JSON: ' + err.message);
                }
            });
        }

        // ==============================================================
        // MAIN INIT
        // ==============================================================
        async function init() {
            try {
                await loadData();

                renderUser();
                renderVideos();
                renderComments();
                setupCommentsToggle();

                if (ytReady) {
                    setTimeout(initYouTubePlayers, 300);
                } else {
                    if (typeof YT !== 'undefined' && YT.Player) {
                        ytReady = true;
                        setTimeout(initYouTubePlayers, 300);
                    }
                }

                setTimeout(() => {
                    if (!ytReady) {
                        attachFallbackHandlers();
                    } else {
                        if (Object.keys(players).length === 0 && videoData.length) {
                            initYouTubePlayers();
                        }
                    }
                }, 1200);

                attachFallbackHandlers();

            } catch (err) {
                console.error('Init error:', err);
                showFallbackInput(err.message || 'Failed to fetch via proxy.');
            }
        }

        // ==============================================================
        // START
        // ==============================================================
        document.addEventListener('DOMContentLoaded', init);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            if (!window._initStarted) {
                window._initStarted = true;
                init();
            }
        }
    </script>

</body>
</html>
